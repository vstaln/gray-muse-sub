[package]
name = "gray-muse-sub"
version = "0.1.4"
edition = "2021"
rust-version = "1.97"
license = "MIT"

[lib]
name = "muse_sub"
path = "src/lib.rs"

[[bin]]
name = "muse-sub"
path = "src/main.rs"

[dependencies]
gray-acp = { git = "https://github.com/vstaln/gray.git" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "v7"] }
muse-code-sdk = "=1.4.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
